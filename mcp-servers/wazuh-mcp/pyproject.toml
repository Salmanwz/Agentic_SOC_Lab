[project]
name = "wazuh-mcp"
version = "0.1.0"
description = "MCP server exposing Wazuh alert search/lookup tools to agents"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
wazuh-mcp = "wazuh_mcp.server:main"

[tool.setuptools.packages.find]
include = ["wazuh_mcp*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
